name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:desktop
        timeout-minutes: 3
      - run: npm run dist
      - run: npm run test:packaged
        timeout-minutes: 3
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Lyrics-Overlay-Windows
          path: |
            release/*Setup.exe
            release/*Windows-x64.zip
            dist/extension/lyrics-overlay.js
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Lyrics-Overlay-Windows
          path: release-assets
      - name: Publish verified binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFiles = @(Get-ChildItem release-assets/release -File | Where-Object { $_.Name -match 'Setup\.exe$|Windows-x64\.zip$' })
          if ($releaseFiles.Count -ne 2) { throw 'Expected verified installer and portable archive' }
          $manifest = foreach ($file in $releaseFiles) { (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $file.Name }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release-assets/SHA256SUMS.txt'), ($manifest -join "`n") + "`n")
          $assets = @($releaseFiles.FullName) + @('release-assets/SHA256SUMS.txt','release-assets/dist/extension/lyrics-overlay.js')
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title "Lyrics Overlay $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
