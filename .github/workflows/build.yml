name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:desktop
        timeout-minutes: 3
      - run: npm run dist
      - run: npm run test:packaged
        timeout-minutes: 3
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Lyrics-Overlay-Windows
          path: |
            release/*Setup.exe
            release/*Windows-x64.zip
            dist/extension/lyrics-overlay.js
